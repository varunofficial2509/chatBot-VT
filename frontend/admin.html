<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Personal Knowledge</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="admin-page">
    <div class="admin-card">
      <h1>Personal Knowledge</h1>

      <div id="login-section">
        <div class="field">
          <label for="password">Admin password</label>
          <input id="password" type="password" autocomplete="current-password" />
        </div>
        <button id="login-button" type="button">Log in</button>
        <div id="login-status" class="status-line"></div>
      </div>

      <div id="upload-section" class="hidden">
        <div class="field">
          <label for="resume-file">Resume (PDF or DOCX) — optional</label>
          <input id="resume-file" type="file" accept=".pdf,.docx" />
        </div>
        <div class="field">
          <label for="profile-file">Profile JSON — optional</label>
          <input id="profile-file" type="file" accept=".json" />
        </div>
        <p class="status-line">Upload either file, or both. Uploading one leaves the other untouched.</p>
        <button id="ingest-button" type="button">Update Knowledge</button>
        <div id="ingest-status" class="status-line"></div>
      </div>
    </div>
  </div>

  <script src="/static/admin.js"></script>
</body>
</html>
